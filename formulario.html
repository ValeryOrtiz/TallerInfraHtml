<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Formulario | Registro de Estudiante</title>

    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, Helvetica, sans-serif;
            background: #0f172a;
            color: #e2e8f0;
            line-height: 1.6;
        }

        .hero {
            min-height: 260px;

            display: flex;
            justify-content: center;
            align-items: center;

            text-align: center;

            padding: 60px 20px;

            background:
                radial-gradient(
                    circle at top right,
                    #334155,
                    #0f172a 60%
                );
        }

        .hero-content {
            max-width: 850px;
        }

        .tag {
            display: inline-block;

            color: #38bdf8;

            font-size: 0.75rem;
            font-weight: bold;

            letter-spacing: 2px;

            margin-bottom: 15px;
        }

        .hero h1 {
            font-size: 2.8rem;

            color: white;

            margin-bottom: 20px;
        }

        .hero p {
            font-size: 1.05rem;
            color: #cbd5e1;
        }

        main {
            max-width: 700px;

            margin: auto;

            padding: 60px 25px;
        }

        .form-card {
            position: relative;

            background: #1e293b;

            border: 1px solid #334155;

            border-radius: 18px;

            padding: 45px;

            overflow: hidden;

            transition:
                transform 0.3s ease,
                border-color 0.3s ease;
        }

        .form-card:hover {
            border-color: #38bdf8;
        }

        .field {
            margin-bottom: 25px;
        }

        label {
            display: block;

            color: #38bdf8;

            font-size: 0.85rem;
            font-weight: bold;

            margin-bottom: 8px;

            letter-spacing: 1px;
        }

        input[type="text"],
        input[type="tel"],
        select {
            width: 100%;

            padding: 12px 15px;

            background: #0f172a;

            color: #e2e8f0;

            border: 1px solid #334155;

            border-radius: 10px;

            font-size: 1rem;

            font-family: inherit;

            transition: border-color 0.3s ease;
        }

        input[type="text"]:focus,
        input[type="tel"]:focus,
        select:focus {
            outline: none;

            border-color: #38bdf8;
        }

        .radio-group {
            display: flex;

            gap: 25px;

            flex-wrap: wrap;

            margin-top: 5px;
        }

        .radio-option {
            display: flex;

            align-items: center;

            gap: 8px;

            background: #0f172a;

            border: 1px solid #334155;

            padding: 10px 16px;

            border-radius: 20px;

            font-size: 0.9rem;

            color: #cbd5e1;

            transition: border-color 0.3s ease;
        }

        .radio-option:hover {
            border-color: #38bdf8;
        }

        .radio-option input {
            accent-color: #38bdf8;
        }

        .buttons {
            display: flex;

            gap: 20px;

            margin-top: 40px;
        }

        button {
            flex: 1;

            padding: 14px 20px;

            border-radius: 10px;

            border: 1px solid #334155;

            font-size: 0.95rem;

            font-weight: bold;

            letter-spacing: 1px;

            cursor: pointer;

            font-family: inherit;

            transition:
                transform 0.3s ease,
                border-color 0.3s ease,
                background 0.3s ease;
        }

        button:hover {
            transform: translateY(-3px);
        }

        .btn-enviar {
            background: #38bdf8;

            color: #0f172a;

            border: 1px solid #38bdf8;
        }

        .btn-enviar:hover {
            background: #0ea5e9;
        }

        .btn-cancelar {
            background: #0f172a;

            color: #cbd5e1;
        }

        .btn-cancelar:hover {
            border-color: #f87171;

            color: #f87171;
        }

        .mensaje {
            display: none;

            margin-top: 25px;

            padding: 14px 18px;

            border-radius: 10px;

            font-size: 0.9rem;

            font-weight: bold;

            text-align: center;

            letter-spacing: 0.5px;
        }

        .mensaje.mostrar {
            display: block;
        }

        .mensaje.exito {
            background: rgba(56, 189, 248, 0.1);

            color: #38bdf8;

            border: 1px solid #38bdf8;
        }

        footer {
            display: flex;

            justify-content: space-between;

            align-items: center;

            max-width: 700px;

            margin: auto;

            padding: 30px 25px;

            border-top: 1px solid #334155;

            color: #64748b;

            font-size: 0.85rem;
        }

        @media (max-width: 480px) {

            main {
                padding: 40px 15px;
            }

            .hero h1 {
                font-size: 2rem;
            }

            .form-card {
                padding: 25px;
            }

            .buttons {
                flex-direction: column;
            }

            footer {
                padding: 25px 15px;
            }

        }

    </style>
</head>


<body>

    <header class="hero">

        <div class="hero-content">

            <span class="tag">
                REGISTRO ACADÉMICO
            </span>

            <h1>Formulario de Estudiante</h1>

            <p>
                Ingrese los datos del estudiante para completar su registro
                en el sistema.
            </p>

        </div>

    </header>

    <main>

        <form class="form-card" id="formEstudiante">

            <div class="field">
                <label for="cedula">Cédula</label>
                <input type="text" id="cedula" name="cedula" placeholder="Ej: 1006123456" required>
            </div>

            <div class="field">
                <label for="nombre">Nombre</label>
                <input type="text" id="nombre" name="nombre" placeholder="Nombre completo" required>
            </div>

            <div class="field">
                <label for="telefono">Teléfono</label>
                <input type="tel" id="telefono" name="telefono" placeholder="Ej: 3001234567" required>
            </div>

            <div class="field">
                <label for="genero">Género</label>
                <select id="genero" name="genero" required>
                    <option value="">Seleccione una opción</option>
                    <option value="femenino">Femenino</option>
                    <option value="masculino">Masculino</option>
                    <option value="otro">Otro</option>
                    <option value="prefiero-no-decir">Prefiero no decir</option>
                </select>
            </div>

            <div class="field">
                <label>Estado</label>
                <div class="radio-group">

                    <div class="radio-option">
                        <input type="radio" id="activo" name="estado" value="activo" checked>
                        <label for="activo" style="margin:0; color:#cbd5e1; font-weight:normal; letter-spacing:normal;">Activo</label>
                    </div>

                    <div class="radio-option">
                        <input type="radio" id="inactivo" name="estado" value="inactivo">
                        <label for="inactivo" style="margin:0; color:#cbd5e1; font-weight:normal; letter-spacing:normal;">Inactivo</label>
                    </div>

                </div>
            </div>

            <div class="buttons">
                <button type="submit" class="btn-enviar">Enviar</button>
                <button type="reset" class="btn-cancelar" id="btnCancelar">Cancelar</button>
            </div>

            <div class="mensaje exito" id="mensajeEstado"></div>

        </form>

    </main>

    <script>

        const formulario = document.getElementById("formEstudiante");
        const mensaje = document.getElementById("mensajeEstado");
        const btnCancelar = document.getElementById("btnCancelar");

        formulario.addEventListener("submit", function (e) {
            e.preventDefault();

            mensaje.textContent = "✔ Datos enviados correctamente";
            mensaje.classList.add("mostrar");

            formulario.reset();

            setTimeout(function () {
                mensaje.classList.remove("mostrar");
            }, 3000);
        });

        btnCancelar.addEventListener("click", function () {
            mensaje.classList.remove("mostrar");
        });

    </script>

    <footer>
        <p>
            Ingeniería de Sistemas y Computación
        </p>

        <span>
            2026
        </span>
    </footer>
</body>
</html>
